[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shortforge-3d"
version = "0.1.0"
description = "Local-first procedural educational Shorts pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shortforge = "shortforge.cli:main"

[tool.setuptools.packages.find]
include = ["shortforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
