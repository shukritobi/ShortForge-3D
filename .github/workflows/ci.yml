name: Phase 1 validation
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q shortforge scripts tests
      - run: python -m shortforge.cli validate examples/water_tower_40s.json

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compositor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
